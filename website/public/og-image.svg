<!--
  Source artwork for the social link preview (Open Graph / Twitter card).

  Exported, not served: social scrapers do not render SVG, so this has to become
  `og-image.jpg` before the meta tags in ../index.html resolve. Any of these work:

    npx sharp-cli -i website/public/og-image.svg -o website/public/og-image.jpg
    # or: open this file in a browser at 1200x630 and screenshot it

  Sized 1200x630 — the aspect ratio every platform crops to for a large card.
  Deliberately uses only generic font families, because the export happens
  wherever the owner runs it and Fredoka One will not be installed there.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="BLINK — your interactive desk robot">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <radialGradient id="orbA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="orbC" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Page background, matching --color-bg -->
  <rect width="1200" height="630" fill="#0a0a0f" />
  <circle cx="180" cy="120" r="380" fill="url(#orbA)" />
  <circle cx="1050" cy="540" r="420" fill="url(#orbB)" />
  <circle cx="880" cy="80" r="300" fill="url(#orbC)" />

  <!-- Left column: wordmark and pitch -->
  <g transform="translate(88, 196)">
    <rect x="0" y="-58" width="196" height="34" rx="17" fill="#6366f1" fill-opacity="0.12" stroke="#6366f1" stroke-opacity="0.28" />
    <text x="18" y="-35" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="700" letter-spacing="1.8" fill="#818cf8">DESK ROBOT</text>

    <text x="0" y="46" font-family="'Fredoka One', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif" font-size="104" font-weight="800" letter-spacing="6" fill="#ffffff">BLINK</text>

    <text x="0" y="112" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="32" font-weight="700" fill="url(#accent)">A tiny robot with a big personality.</text>

    <text x="0" y="164" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="500" fill="#ffffff" fill-opacity="0.62">ESP32-C3 &#183; 0.96&#8221; OLED &#183; motion sensing</text>
    <text x="0" y="196" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="21" font-weight="500" fill="#ffffff" fill-opacity="0.62">BLE companion app &#183; open source</text>

    <g transform="translate(0, 240)">
      <rect width="212" height="52" rx="26" fill="url(#accent)" />
      <text x="106" y="33" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="18" font-weight="700" fill="#ffffff">From &#8377;3,999</text>
    </g>
  </g>

  <!-- Right column: the robot, drawn as its own OLED face in a case -->
  <g transform="translate(700, 138)">
    <rect x="0" y="0" width="404" height="354" rx="52" fill="#12121a" stroke="#ffffff" stroke-opacity="0.10" />
    <rect x="30" y="30" width="344" height="212" rx="26" fill="#1f2937" stroke="#ffffff" stroke-opacity="0.08" />
    <rect x="48" y="48" width="308" height="176" rx="14" fill="#000000" />

    <!-- Eyes and smile: the same shapes drawEyes()/drawIdle() paint in Demo.jsx -->
    <g fill="#ffffff">
      <circle cx="130" cy="122" r="34" />
      <circle cx="274" cy="122" r="34" />
    </g>
    <g fill="#000000">
      <circle cx="136" cy="126" r="15" />
      <circle cx="280" cy="126" r="15" />
    </g>
    <g fill="#ffffff">
      <circle cx="131" cy="121" r="5" />
      <circle cx="275" cy="121" r="5" />
    </g>
    <path d="M178 178 q24 22 48 0" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" />

    <!-- Case details: status LED and the touch pad -->
    <circle cx="202" cy="272" r="7" fill="#6366f1" />
    <rect x="150" y="300" width="104" height="12" rx="6" fill="#ffffff" fill-opacity="0.10" />
  </g>

  <!-- Footer strip -->
  <rect x="0" y="586" width="1200" height="4" fill="url(#accent)" />
  <text x="88" y="566" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff" fill-opacity="0.42">viraj69rip.github.io/Blink</text>
  <text x="1112" y="566" text-anchor="end" font-family="'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif" font-size="17" font-weight="600" fill="#ffffff" fill-opacity="0.42">Made in India</text>
</svg>
