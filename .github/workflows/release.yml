name: Build BLINK release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Build ESP32-C3 firmware
        run: |
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.11
          arduino-cli lib install U8g2 NimBLE-Arduino "Adafruit MPU6050" "Adafruit Unified Sensor" "Adafruit BusIO"
          arduino-cli compile --fqbn esp32:esp32:esp32c3 --output-dir release/firmware firmware/BLINK_Robot
          cp release/firmware/BLINK_Robot.ino.bin "release/BLINK_Robot-${GITHUB_REF_NAME}.bin"
          cp BLINK_Robot_v2_share.ino "release/BLINK_Robot-${GITHUB_REF_NAME}.ino"

      # Pinned to 3.27.4 — must stay in step with ci.yml.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          
      - name: Patch Flutter for Gradle 9 compatibility
        run: |
          FLUTTER_GROOVY=$(find /opt/hostedtoolcache/flutter -name flutter.groovy | head -n 1)
          echo "Patching $FLUTTER_GROOVY for Gradle 9 (Groovy 4) compatibility..."
          sed -i 's/import groovy.xml.QName/import groovy.namespace.QName/g' "$FLUTTER_GROOVY"
          sed -i 's/import groovy.util.XmlParser/import groovy.xml.XmlParser/g' "$FLUTTER_GROOVY"
      - name: Decode Android keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > blink_app/android/app/keystore.jks

      - name: Build signed Android APKs
        working-directory: blink_app
        env:
          KEYSTORE_FILE: keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi
          for f in build/app/outputs/flutter-apk/*.apk; do
            base=$(basename "$f")
            arch=$(echo "$base" | sed -E 's/.*-(arm64-v8a|armeabi-v7a|x86_64)-.*/\1/')
            cp "$f" "../release/BLINK-Companion-${GITHUB_REF_NAME}-${arch}.apk"
          done

      # Security: only publish compiled .bin, .apk, and the shareable .ino assets.
      # Never upload full source code zip/dart to releases.
      - name: Verify no full source code leaks in release directory
        run: |
          echo "Checking release directory for source code leaks..."
          if ls release/*.zip release/*.dart 2>/dev/null; then
            echo "ERROR: Source code files found in release directory!"
            exit 1
          fi
          echo "✓ No source code files found. Safe to publish."
          ls -la release/

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/BLINK_Robot-*.bin
            release/BLINK-Companion-*.apk
            release/BLINK_Robot-*.ino
