# Keeps the published site in step with `website/`.
#
# GitHub Pages for this repo is configured as "deploy from a branch → main /docs",
# so the live site is whatever is committed under `docs/`. Editing `website/src`
# alone changed nothing users could see until someone remembered to run
# `npm run build` and commit the output — which is how `docs/` drifted behind in
# the first place. This job does that step.
#
# The cleaner long-term option is to switch Pages to "GitHub Actions" as its
# source and publish with actions/deploy-pages, which stops build output from
# being committed at all. That needs a one-time change in repo Settings → Pages,
# so it is left as a deliberate choice rather than done here.
name: Deploy website

on:
  push:
    branches: [main]
    # Only source changes. A commit that touches nothing but `docs/` — including
    # this workflow's own commit — must not retrigger it.
    paths:
      - 'website/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        working-directory: website
        run: npm ci

      # vite.config.js writes to ../docs with emptyOutDir, so this replaces the
      # committed output wholesale rather than merging into it.
      - name: Build
        working-directory: website
        run: npm run build

      # Pages runs Jekyll over the directory unless told not to, which would
      # drop any future underscore-prefixed asset. Cheap insurance; the build
      # wipes docs/ each time, so it has to be recreated after.
      - name: Disable Jekyll processing
        run: touch docs/.nojekyll

      - name: Commit refreshed docs/
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A docs
          if git diff --cached --quiet; then
            echo 'docs/ already matches this build — nothing to commit.'
            exit 0
          fi
          git commit -m "chore(website): rebuild docs/ from ${GITHUB_SHA::7}"
          git push
